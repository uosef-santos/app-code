<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة التحقق</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #38bdf8;
            max-width: 340px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            letter-spacing: 3px;
            color: #38bdf8;
            margin: 15px 0;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 10px;
            line-height: 1.5;
        }
        .timer {
            color: #f43f5e;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>كود التحقق المجاني</h2>
        <h1 id="codeBox">------</h1>
        <div class="timer" id="timerBox">صالح لهذه الساعة فقط</div>
        <p>⚠️ انسخ هذا الكود وضعه في التطبيق لتشغيله لمدة ساعة مجاناً.</p>

        <a href="https://wa.me/+201023326791" target="_blank" class="btn-whatsapp">
            تواصل مع المطور لشراء كود دائم
        </a>
    </div>

    <script>
        // توليد كود موحد وثابت خلال الساعة الحالية ليتوافق مع التطبيق
        const now = new Date();
        const hourKey = now.getFullYear() + "" + now.getMonth() + "" + now.getDate() + "" + now.getHours();
        
        let hash = 0;
        for (let i = 0; i < hourKey.length; i++) {
            hash = (hash << 5) - hash + hourKey.charCodeAt(i);
            hash |= 0;
        }
        const hourlyCode = Math.abs(hash % 900000) + 100000;

        document.getElementById("codeBox").innerText = hourlyCode;
    </script>
</body>
</html>
