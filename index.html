<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة التحقق</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #38bdf8;
            max-width: 320px;
        }
        h1 {
            font-size: 35px;
            letter-spacing: 3px;
            color: #38bdf8;
            margin: 15px 0;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>كود التحقق الخاص بك</h2>
        <h1 id="codeBox">------</h1>
        <p>⚠️ ملاحظة: هذا الكود صالح لمدة ساعة واحدة فقط ثم يتغير تلقائياً.</p>
    </div>
    <script>
        // توليد كود ثابت يتغير كل ساعة بناءً على الوقت الحالي ونظام التاريخ
        const now = new Date();
        const hourKey = now.getFullYear() + "" + now.getMonth() + "" + now.getDate() + "" + now.getHours();
        
        // دالة تحويل التاريخ والساعة إلى رقم ثابت خلال هذه الساعة
        let hash = 0;
        for (let i = 0; i < hourKey.length; i++) {
            hash = (hash << 5) - hash + hourKey.charCodeAt(i);
            hash |= 0;
        }
        const hourlyCode = Math.abs(hash % 900000) + 100000;
        
        document.getElementById("codeBox").innerText = hourlyCode;
    </script>
</body>
</html>
